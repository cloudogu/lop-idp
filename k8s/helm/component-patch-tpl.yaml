apiVersion: v1
values:
  images:
    ldap: "registry.cloudogu.com/official/ldap:2.6.13-1"
    kubectl: "docker.io/alpine/kubectl:1.35.3"
    cas: "registry.cloudogu.com/official/cas:7.3.7-3"
    chownInit: "docker.io/busybox:1.36"
    additionalMountsInit: "docker.io/cloudogu/dogu-additional-mounts-init:0.1.2"
    usermgt: "registry.cloudogu.com/official/usermgt:1.22.1-2"
    ldapMapper: "registry.cloudogu.com/official/ldap-mapper:1.6.2-9"
    authRegistrationOperator: "docker.io/cloudogu/k8s-auth-registration-operator:1.1.2"
patches:
  values.yaml:
    ldap:
      image:
        registry: "{{ registryFrom .images.ldap }}"
        repository: "{{ repositoryFrom .images.ldap }}"
        tag: "{{ tagFrom .images.ldap }}"
      migration:
        hook:
          image:
            repository: '{{ printf "%s/%s" (registryFrom .images.kubectl) (repositoryFrom .images.kubectl) }}'
            tag: "{{ tagFrom .images.kubectl }}"
      persistence:
        resize:
          hook:
            image:
              repository: '{{ printf "%s/%s" (registryFrom .images.kubectl) (repositoryFrom .images.kubectl) }}'
              tag: "{{ tagFrom .images.kubectl }}"
    cas:
      containers:
        cas:
          image:
            registry: "{{ registryFrom .images.cas }}"
            repository: "{{ repositoryFrom .images.cas }}"
            tag: "{{ tagFrom .images.cas }}"
      initContainers:
        volumeChown:
          image:
            registry: "{{ registryFrom .images.chownInit }}"
            repository: "{{ repositoryFrom .images.chownInit }}"
            tag: "{{ tagFrom .images.chownInit }}"
        additionalMounts:
          image:
            registry: "{{ registryFrom .images.additionalMountsInit }}"
            repository: "{{ repositoryFrom .images.additionalMountsInit }}"
            tag: "{{ tagFrom .images.additionalMountsInit }}"
    usermgt:
      additionalImages:
        chownInitImage: "{{ .images.chownInit }}"
      image:
        registry: "{{ registryFrom .images.usermgt }}"
        repository: "{{ repositoryFrom .images.usermgt }}"
        tag: "{{ tagFrom .images.usermgt }}"
    ldap-mapper:
      image:
        registry: "{{ registryFrom .images.ldapMapper }}"
        repository: "{{ repositoryFrom .images.ldapMapper }}"
        tag: "{{ tagFrom .images.ldapMapper }}"
    k8s-auth-registration-operator:
      manager:
        image:
          registry: "{{ registryFrom .images.authRegistrationOperator }}"
          repository: "{{ repositoryFrom .images.authRegistrationOperator }}"
          tag: "{{ tagFrom .images.authRegistrationOperator }}"
